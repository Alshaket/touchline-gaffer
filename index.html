<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1b24">
<title>Touchline Gaffer - Football Manager</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b1720;--bg2:#10222f;--panel:#162b3b;--panel2:#1d3a50;--line:#2b4b63;--ink:#f4efe1;--mut:#8ea8ba;--amber:#ffb927;--green:#35c26b;--red:#ff5a5f;--blue:#4aa8ff;--pitch:#2f8f4e;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.02em}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "view" "tabs";max-width:560px;margin:0 auto;background:linear-gradient(180deg,var(--bg2),var(--bg) 40%)}
#topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:#0a141c;border-bottom:1px solid var(--line)}
#topbar .club{flex:1;min-width:0}
#topbar .cn{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .cs{font-size:11px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:800;font-size:14px}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe28a,var(--amber) 55%,#b97b00);display:inline-block;box-shadow:0 0 0 2px #7a4f00 inset}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:16px}
#view{grid-area:view;overflow-y:auto;overflow-x:hidden;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
#tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);background:#0a141c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mut);position:relative}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--amber)}
#tabs button .dot{position:absolute;top:5px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.card h3{font-size:13px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;transition:transform .08s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#ffcb52,var(--amber));color:#2a1c00;border-color:#b57d00;box-shadow:0 3px 0 #8a5d00}
.btn.pri:active{box-shadow:0 1px 0 #8a5d00;transform:translateY(2px)}
.btn.ad{background:linear-gradient(180deg,#3ea6ff,#1d73d6);border-color:#1558a8;color:#fff}
.btn.big{font-size:18px;padding:14px;width:100%}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.adtag{font-size:9px;background:#0b3c75;border-radius:4px;padding:1px 4px;margin-right:5px;letter-spacing:.06em}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:10px}
.seg{display:flex;background:#0a141c;border-radius:12px;padding:3px;gap:3px;margin-bottom:10px;border:1px solid var(--line)}
.seg button{flex:1;background:none;padding:8px 4px;border-radius:9px;font-weight:800;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--panel2);color:var(--amber)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:#0a141c;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;color:var(--mut)}
.pill.on{background:var(--amber);color:#2a1c00;border-color:#b57d00}
.bar{height:7px;background:#0a141c;border-radius:9px;overflow:hidden;border:1px solid #1d3345}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.bar.low i{background:var(--red)}.bar.mid i{background:var(--amber)}
.pos{display:inline-block;min-width:34px;text-align:center;font-size:10px;font-weight:900;border-radius:6px;padding:2px 4px;color:#08121a}
.pos.GK{background:var(--amber)}.pos.DEF{background:var(--blue)}.pos.MID{background:var(--green)}.pos.FWD{background:#ff7a7f}
.fixture{display:flex;align-items:center;justify-content:space-around;gap:6px;text-align:center;padding:6px 0}
.fixture .tm{flex:1;font-weight:900;font-size:14px;min-width:0}
.fixture .tm svg{display:block;margin:0 auto 4px}
.vs{font-weight:900;color:var(--mut);font-size:18px}
.form{display:flex;gap:4px}
.form b{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;color:#08121a}
.form .W{background:var(--green)}.form .D{background:var(--amber)}.form .L{background:var(--red)}
.tip{background:#10283a;border-left:4px solid var(--amber);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:12px}
.stad{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.stad svg{display:block;width:100%;height:auto}
.grid2{display:block}
/* lineup */
.pitchwrap{position:relative;width:100%;aspect-ratio:7/8;max-height:56vh;margin:0 auto 10px;border-radius:14px;overflow:hidden;border:2px solid #1c6a39}
.pitchwrap svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pchip{position:absolute;transform:translate(-50%,-50%);width:58px;text-align:center;touch-action:none;cursor:grab}
.pchip .sh{width:38px;height:38px;margin:0 auto;position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.pchip .sh svg{width:100%;height:100%}
.pchip .sh b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;padding-top:3px}
.pchip .nm{font-size:10px;font-weight:800;background:rgba(6,14,20,.78);border-radius:5px;padding:1px 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .fb{height:3px;background:#06100a;margin:2px 8px 0;border-radius:2px;overflow:hidden}.pchip .fb i{display:block;height:100%;background:var(--green)}
.pchip.sel .sh{outline:3px solid var(--amber);border-radius:50%;animation:pulse 1s infinite}
.pchip.oop .nm{background:#a05a00}
.pchip.tired .fb i{background:var(--red)}
.pchip.dragging{opacity:.35}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-70%) scale(1.15);opacity:.95}
@keyframes pulse{50%{outline-color:#fff6}}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.bench .pchip{position:relative;transform:none;left:auto!important;top:auto!important;width:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 2px}
.bench .pchip.sel{border-color:var(--amber)}
.bench .pchip.inj{opacity:.5}
.bench .pchip .ps{font-size:9px;color:var(--mut)}
.bars4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bars4 div{font-size:11px;font-weight:800;color:var(--mut)}
.bars4 b{display:block;color:var(--ink);font-size:16px}
/* squad */
.prow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid #20394d}
.prow .ov{width:36px;height:36px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:900;font-size:16px}
.prow .nm{font-weight:800;font-size:14px}
.prow .meta{font-size:11px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.attrs div{font-size:10px;color:var(--mut);font-weight:800}
.det{grid-column:1/-1;background:#10283a;border-radius:10px;padding:8px;margin-top:4px}
/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;color:var(--mut);text-transform:uppercase;text-align:right;padding:4px}
.tbl td{padding:7px 4px;text-align:right;border-top:1px solid #20394d}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td:first-child,.tbl th:first-child{text-align:center;width:24px}
.tbl tr.me td{background:#254a2f;font-weight:900}
.tbl tr.up td:first-child{box-shadow:inset 3px 0 var(--green)}
.tbl tr.dn td:first-child{box-shadow:inset 3px 0 var(--red)}
.tn{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.fxl{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:6px 0;border-top:1px solid #20394d;font-size:13px}
.fxl .a{text-align:right}.fxl .sc{font-weight:900;background:#0a141c;border-radius:6px;padding:2px 8px;text-align:center;min-width:52px}
.fxl.me{background:#1d3a2a;border-radius:8px;padding-left:4px;padding-right:4px}
/* shop */
.ucard{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center}
.ucard .ic{width:54px;height:54px;border-radius:14px;background:var(--panel2);display:grid;place-items:center}
.lv{display:flex;gap:3px;margin:4px 0}.lv i{width:16px;height:6px;border-radius:3px;background:#0a141c}.lv i.on{background:var(--amber)}
.mk{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #20394d}
/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,9,14,.82);display:grid;place-items:center;padding:14px;overflow-y:auto}
.overlay.full{background:var(--bg);display:block;padding:0;z-index:60}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;width:min(440px,100%);max-height:92vh;overflow-y:auto}
.modal h2{font-size:22px;margin-bottom:8px}
.modal p{margin:6px 0;line-height:1.4}
#toast{pointer-events:none;position:fixed;left:50%;top:74px;bottom:auto;transform:translateX(-50%);background:#0a141c;border:1px solid var(--amber);padding:9px 14px;border-radius:12px;font-weight:800;font-size:13px;z-index:200;max-width:90vw;text-align:center}
/* title */
.title-screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#1d4a38 0,#0b1720 62%);padding:16px;overflow-y:auto}
.title-in{width:min(420px,100%);text-align:center}
.title-in .logo{width:min(260px,70%);margin:0 auto 6px;display:block;filter:drop-shadow(0 8px 14px #0008)}
.title-in h1{font-size:40px;line-height:1;text-transform:uppercase;font-style:italic;color:var(--ink);text-shadow:0 3px 0 #0b3b22}
.title-in h1 span{color:var(--amber)}
.title-in p.sub{color:var(--mut);margin:8px 0 18px}
.field{display:block;text-align:left;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:10px 0 4px}
.inp{width:100%;background:#0a141c;border:2px solid var(--line);border-radius:12px;color:var(--ink);padding:11px;font:inherit;font-weight:800;-webkit-user-select:text;user-select:text}
.swatches{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.sw{width:42px;height:42px;border-radius:12px;border:3px solid transparent;padding:0;overflow:hidden}
.sw.on{border-color:var(--amber)}
.sw svg{width:100%;height:100%;display:block}
/* match */
.mwrap{max-width:820px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px 10px;gap:8px}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:#0a141c;border:1px solid var(--line);border-radius:14px;padding:8px}
.mhead .t{text-align:center;font-weight:900;font-size:13px;min-width:0}
.mhead .t svg{display:block;margin:0 auto 2px}
.mhead .sc{font-size:34px;font-weight:900;text-align:center;line-height:1}
.mhead .clk{font-size:12px;color:var(--amber);font-weight:900;text-align:center;margin-top:2px}
.mpitch{position:relative;width:100%;aspect-ratio:2/1;border-radius:12px;overflow:hidden;border:2px solid #1c6a39;flex:none}
.mpitch svg.bg{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;width:4.2%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);transition:left .55s ease,top .55s ease;border:2px solid;box-shadow:0 1px 3px #0008}
.ball{position:absolute;width:3.2%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#fff 45%,#d6d6d6 100%);border:2px solid #111;transform:translate(-50%,-50%);transition:left .4s ease,top .4s ease;box-shadow:0 0 0 2px #0007,0 2px 4px #000a;z-index:3}
.gbanner{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(34px,10vw,64px);font-weight:900;font-style:italic;color:var(--amber);text-shadow:0 4px 0 #6b4400,0 0 20px #000;opacity:0;pointer-events:none;z-index:4}
.gbanner.show{animation:gb 1.3s ease-out}
@keyframes gb{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.feed{list-style:none;margin:0;padding:0;flex:1;min-height:90px;overflow-y:auto;background:#0a141c;border:1px solid var(--line);border-radius:12px}
.feed li{padding:6px 10px;font-size:13px;border-bottom:1px solid #162a39;display:flex;gap:8px;animation:fi .3s}
.feed li b{color:var(--amber);min-width:30px}
.feed li.goal{background:#274c2e;font-weight:800}.feed li.red{background:#4a1d20}.feed li.sys{color:var(--mut);font-style:italic}
.feed li.yellow b{color:#ffe14d}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
.mctl{display:flex;gap:8px;flex:none}.mctl .btn{flex:1}
.mmodal{position:absolute;inset:0;background:rgba(3,9,14,.88);display:grid;place-items:center;padding:14px;z-index:5;overflow-y:auto}
.statrow{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center;font-size:12px;margin:5px 0;text-align:center}
.statrow .m{color:var(--mut);font-weight:800;text-transform:uppercase;font-size:10px}
.statrow .sb{display:flex;height:7px;border-radius:5px;overflow:hidden;background:#0a141c}
.big-res{font-size:44px;font-weight:900;text-align:center;line-height:1.05}
.reward{display:flex;justify-content:center;align-items:center;gap:8px;font-size:22px;font-weight:900;color:var(--amber);margin:8px 0}
.adbox{width:min(360px,100%);background:#fff;color:#222;border-radius:14px;padding:18px;text-align:center}
.adbox h3{color:#222;font-size:16px}
.adbox .pb{height:8px;background:#ddd;border-radius:5px;margin:12px 0;overflow:hidden}.adbox .pb i{display:block;height:100%;width:0;background:#1d73d6;transition:width 2.4s linear}
/* desktop */
@media (min-width:900px){
  #app{max-width:1180px;grid-template-columns:200px 1fr;grid-template-areas:"top top" "tabs view";grid-template-rows:auto 1fr;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  #tabs{grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;border-top:0;border-right:1px solid var(--line);padding:10px 8px}
  #tabs button{flex-direction:row;gap:12px;padding:12px;font-size:14px;border-radius:12px;justify-content:flex-start}
  #tabs button.on{background:var(--panel)}
  #tabs button .dot{right:12px;top:16px}
  #view{padding:16px 22px 84px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .grid2.lineup{grid-template-columns:minmax(380px,1.1fr) 1fr}
  .pitchwrap{max-height:62vh;max-width:520px}
  .bench{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .home3{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
  #toast{top:74px;bottom:auto}
}
@media (max-height:700px) and (min-width:900px){.pitchwrap{max-height:52vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.live{flex:none;background:#0a141c;border:1px solid var(--line);border-radius:12px;padding:6px 12px}.live .statrow{margin:3px 0}

/* ===== v2 additions ===== */
/* matchup header: team name sits directly under its crest, VS between the crests */
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:8px;align-items:start;padding:4px 0}
.mu .tm{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.mu .tm svg{display:block;width:var(--cs);height:var(--cs);flex:none}
.mu .tn2{font-weight:900;font-size:14px;line-height:1.15;margin-top:5px;overflow-wrap:anywhere}
.mu .tag{margin-top:3px;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--mut);background:#0a141c;border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.mu .tag.you{background:var(--amber);color:#2a1c00;border-color:#b57d00}
.mu .mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:56px;text-align:center}
.mu .mid .vs{font-weight:900;color:var(--mut);font-size:18px;line-height:var(--cs)}
.mu .mid .vs+.sc,.mu .mid .vs+.big-res{margin-top:-6px}
.mucard{padding:8px 12px 10px}.mucard h3{margin-bottom:2px}
.mu.mhmu .mid .vs{font-size:11px;line-height:1;margin-bottom:2px;margin-top:4px}
.mu.mhmu .mid .vs+.sc{margin-top:0}
/* backups / subs */
.bkb{display:inline-block;background:linear-gradient(180deg,#ffd467,#e29a00);color:#2a1c00;font-size:8px;font-weight:900;border-radius:5px;padding:1px 4px;letter-spacing:.04em;line-height:1.3}
.pchip .bkb{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap}
.bkb.static{position:static;transform:none;font-size:9px;vertical-align:middle}
.bench .pchip{padding-top:9px}
.grp{font-size:11px;font-weight:800;color:var(--mut);margin:6px 0 6px}
.bench .pchip:has(.bkb){border-color:#c28a1a}
/* press / drag feedback */
.pchip,.prow,.mk{-webkit-touch-callout:none}
.pressing{transform:scale(.96);filter:brightness(1.25);transition:transform .15s,filter .15s}
.pitchwrap .pchip.pressing{transform:translate(-50%,-50%) scale(1.1)}
.lpflash{animation:lpf .4s ease-out}
@keyframes lpf{0%{box-shadow:0 0 0 0 #ffb927cc}100%{box-shadow:0 0 0 14px #ffb92700}}
.pchip.drop .sh{outline:3px dashed #fff;border-radius:50%}
.prow,.mk{touch-action:pan-y}
/* player detail card */
.modal:has(.pcard){width:min(400px,100%)}
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.povr,.pgrade{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;height:56px;border-radius:14px;background:var(--panel2);border:2px solid var(--line)}
.povr b{font-size:26px;line-height:1}.pgrade b{font-size:22px;line-height:1;color:var(--amber)}
.povr small,.pgrade small{font-size:8px;color:var(--mut);font-weight:900;letter-spacing:.06em;margin-top:2px}
.pid h2{font-size:18px;margin:0 0 3px}
.pq{margin:12px 0 8px;background:#10283a;border-radius:12px;padding:10px}
.qbar{position:relative;height:12px;background:#0a141c;border-radius:8px;border:1px solid #1d3345;margin-top:4px}
.qbar .cur{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#2aa75d,#35c26b)}
.qbar .pot{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;border-radius:3px;background:var(--amber);box-shadow:0 0 6px #ffb927}
.stars{color:var(--amber);letter-spacing:1px;font-size:14px}.stars i{color:#3a5568;font-style:normal}
.pattrs{display:grid;gap:5px;margin:8px 0}
.pbar{display:grid;grid-template-columns:74px 1fr 30px;gap:8px;align-items:center;font-size:12px;font-weight:800;color:var(--mut)}.pbar b{color:var(--ink);text-align:right}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pgrid>div{background:#10283a;border-radius:10px;padding:7px 9px;font-size:13px}
.pgrid small{display:block;font-size:10px;color:var(--mut);font-weight:800;text-transform:uppercase;margin-bottom:2px}
.pgrid b{display:block;font-size:14px}
/* cup bracket */

  <div><div class="card"><h3>Statistics</h3><table class="tbl" id="careerStats"><thead><tr><th></th><th>Apps</th><th>G</th><th>A</th><th>CS</th><th>Avg</th><th>Min</th></tr></thead><tbody><tr><td><b>Season ${S.season}</b></td><td>${s.apps}</td><td>${s.g}</td><td>${s.a}</td><td>${s.cs}</td><td>${av(s)}</td><td>${s.min}</td></tr><tr><td><b>Career</b></td><td>${c.apps}</td><td>${c.g}</td><td>${c.a}</td><td>${c.cs}</td><td>${av(c)}</td><td>${c.min}</td></tr></tbody></table></div>
  <div class="card" id="objCard2"><h3>Season goals</h3>${objectives().map(o => `<div class="obj ${o.ok ? 'ok' : ''}"><span>${o.ok ? '&#10003;' : '&#9675;'} ${o.t}</span><b>${o.inv ? 'top ' + o.need : (o.dec ? o.have.toFixed(1) : o.have) + ' / ' + o.need}</b></div>`).join('')}</div>
  ${hist ? `<div class="card"><h3>Career history</h3><table class="tbl"><thead><tr><th>Yr</th><th>Club</th><th>Ap</th><th>G</th><th>A</th><th>Avg</th><th>OVR</th></tr></thead><tbody>${hist}</tbody></table></div>` : ''}
  <button class="btn big" data-act="retireask" id="btnRetire" style="width:100%;margin-top:4px">Retire from football</button></div></div>`;
}
function vShopC() {
  const NAMES = { train: ['Personal coach', l => l === 1 ? 'A basic training plan.' : `Skill-drill gains +${(l - 1) * 20}% and +${(l - 1) * 3} fitness recovery.`], stadium: ['Sponsorship deals', l => `Match earnings +${(l - 1) * 25}%.`], scout: ['Agent', l => `Transfer offers: +${((l - 1) * 1.5).toFixed(1)} to your offer rating (better clubs come calling).`] };
  return Object.keys(NAMES).map(k => { const l = S.up[k], max = l >= 5, c = UPG_COST[l - 1]; return `<div class="card ucard"><div class="ic">${UICONS[UPG[k].ic]}</div><div><b>${NAMES[k][0]}</b><div class="lv">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= l ? 'on' : ''}"></i>`).join('')}</div><div class="small mut">${NAMES[k][1](l)}${max ? '' : ' Next: ' + NAMES[k][1](l + 1)}</div></div>${max ? '<span class="pill on">MAX</span>' : `<button class="btn pri sm" data-act="upgrade" data-v="${k}" ${S.coins < c ? 'disabled' : ''}>${coinHTML}${fmt(c)}</button>`}</div>`; }).join('') + `<div class="card"><h3>Offer rating</h3><p class="small mut" style="margin:0">Clubs judge you on overall + fame + your agent: <b style="color:var(--ink)">${(E.ovr(myPl()) + S.me.rep / 20 + (S.up.scout - 1) * 1.5).toFixed(1)}</b>. Silver clubs want ${OFFER_NEED[1]}, Gold clubs want ${OFFER_NEED[2]}. Offers arrive at season end.</p></div>`;
}
function showEndC() {
  const e = S.endSummary; if (!e || !e.car) return; const c = e.car, pl = myPl();
  const title = e.champ ? 'League Champions!' : e.outcome === 'promoted' ? 'Promoted!' : e.outcome === 'relegated' ? 'Relegated...' : 'Season complete';
  modal(`<h2>${esc(title)}</h2><p style="margin:4px 0">${esc(S.club.name)} finished <b>${ord(e.pos)}</b> in the ${TIERS[e.tier]} (${e.W}W ${e.D}D ${e.L}L).</p>
  <div class="cstats" style="margin:8px 0"><div><b>${c.s.apps}</b><small>Apps</small></div><div><b>${c.s.g}</b><small>Goals</small></div><div><b>${c.s.a}</b><small>Assists</small></div><div><b>${c.avg ? c.avg.toFixed(1) : '-'}</b><small>Avg</small></div><div><b>${c.ovr0}&rarr;${c.ovr1}</b><small>Overall</small></div></div>
  <h3 class="small mut" style="margin:6px 0">SEASON GOALS</h3>${c.objs.map(o => `<div class="obj ${o.ok ? 'ok' : ''}"><span>${o.ok ? '&#10003;' : '&#10007;'} ${o.t}</span><b>${o.inv ? 'finish ' + o.have : (o.dec ? o.have.toFixed(1) : o.have) + ' / ' + o.need}</b></div>`).join('')}
  ${c.aw.length ? `<h3 class="small mut" style="margin:10px 0 4px">AWARDS</h3><div class="cabinet">${c.aw.map(a => `<span class="trophy">&#127942; ${esc(a)}</span>`).join('')}</div>` : ''}
  <div class="reward">${coinHTML}<span>+${fmt(c.pay + e.prize + e.bonus)}</span></div><p class="small mut" style="text-align:center;margin-top:0">Goals and awards pay ${fmt(c.pay)}; club prize money ${fmt(e.prize + e.bonus)} (already added).</p>
  <button class="btn pri big" data-act="offers" id="btnOffers">${pl.age >= 35 ? 'Decide your future' : 'Contract talks'}</button>`, { back: false });
}
function showOffers() {
  const e = S.endSummary, pl = myPl(), o = offersFor(e); S.me._offers = o.list;
  modal(`<h2>${S.me.retireNow ? 'Time to decide' : 'Contract talks'}</h2><p class="small mut" style="margin:2px 0 8px">Offer rating <b style="color:var(--ink)">${o.eff}</b> (overall + fame + agent). ${pl.age >= 33 ? 'You are ' + pl.age + ': your body is slowing down.' : ''}</p>
  <div id="offerList">${o.list.map((x, i) => `<button class="offer" data-act="takeoffer" data-v="${i}" id="offer${i}"><span class="crest">${crest(x.club, 34)}</span><span><b>${esc(x.txt)}</b><small>${x.sub}</small></span></button>`).join('')}</div>
  ${pl.age >= 30 || S.me.retireNow ? `<button class="btn big" style="margin-top:8px;width:100%;color:var(--amber)" data-act="retireask">Retire and see your legacy</button>` : ''}`, { back: false });
}
function legacyScore() { const c = pstat(myPl()).c; return Math.round(c.g * 3 + c.a * 2 + c.apps * 0.5 + c.cs + S.me.awards.length * 40 + S.trophies * 60 + S.me.peak * 5 + S.me.rep); }
function showLegacy() {
  const pl = myPl(), c = pstat(pl).c, sc = legacyScore(), rank = sc < 400 ? 'Journeyman' : sc < 900 ? 'Club Hero' : sc < 1600 ? 'League Star' : sc < 2600 ? 'Legend' : 'All-time Great';
  modal(`<div id="legacy"><div class="tiny mut" style="text-align:center;letter-spacing:.12em;font-weight:800">CAREER COMPLETE</div><h2 style="text-align:center;margin:2px 0">${esc(pl.first + ' ' + pl.last)}</h2><div class="big-res" style="color:var(--amber);font-size:30px">${rank}</div><p class="small mut" style="text-align:center;margin:2px 0 8px">Legacy score ${fmt(sc)}</p>
  <div class="cstats"><div><b>${S.me.seasons.length}</b><small>Seasons</small></div><div><b>${c.apps}</b><small>Apps</small></div><div><b>${c.g}</b><small>Goals</small></div><div><b>${c.a}</b><small>Assists</small></div><div><b>${S.me.peak}</b><small>Peak OVR</small></div></div>
  <h3 class="small mut" style="margin:10px 0 4px">AWARDS &amp; TROPHIES</h3><div class="cabinet">${S.me.awards.map(a => `<span class="trophy">&#127942; ${esc(a.name)} <small>S${a.season}</small></span>`).join('') || '<span class="mut small">None</span>'}${S.trophies ? `<span class="trophy">&#127941; ${S.trophies} ${S.trophies === 1 ? 'team trophy' : 'team trophies'}</span>` : ''}</div>
  <button class="btn pri big" style="margin-top:12px" data-act="titlescreen" id="btnLegacyDone">Main menu</button></div>`, { back: false });
}
function careerRetire() { S.me.retired = true; save(); showLegacy(); }

function careerTips(fx, pr) {
  const t = [splitTip(pr)], pl = myPl(), role = roleNow();
  t.push(`Your role: <b style="color:${role.col}">${role.txt}</b>.`);
  if (role.k !== 'inj' && role.k !== 'out') t.push(`Key-moment zone: <b>${Math.round(momZone(pl) * 100)}%</b> wide. A higher ${ATTR_LONG[MAIN_ATTR[pl.pos]]} rating, good fitness${S.me.prep === S.ci ? '' : ' and Film study'} widen it.`);
  if (pl.fit < 70) t.push('Your fitness is low. A Recovery session helps your moments and ratings.');
  if (pr.pv.w > 0.6) t.push('Your team are favourites: a strong rating is the way to earn trust.'); else if (pr.pv.l > 0.5) t.push('Tough opponent. A good individual display still raises your trust.');
  return t;
}
function careerCard(L) {
  const c = L.car; if (!c) return '';
  const qn = q => q >= 1 ? '<b style="color:var(--green)">Perfect</b>' : q > 0 ? '<b style="color:var(--amber)">Good</b>' : q === 0 ? '<b style="color:var(--red)">Missed</b>' : '<span class="mut">n/a</span>';
  const info = MOM_INFO[myPl().pos];
  return `<div class="postan careercard" id="careerCard2"><h3 class="small mut" style="margin:0 0 6px">YOUR PERFORMANCE</h3>
  ${c.played ? `<div class="row"><span class="rt ${c.rating >= 8 ? 'r-hi' : c.rating >= 7 ? 'r-ok' : c.rating >= 6 ? 'r-mid' : 'r-lo'}" style="font-size:20px">${c.rating.toFixed(1)}</span><span class="small">${c.g} goal${c.g === 1 ? '' : 's'}, ${c.a} assist${c.a === 1 ? '' : 's'} &middot; ${c.min} min</span></div>
  <div class="small" style="margin-top:4px">Key moments (${info[2]}): ${c.moms.length ? c.moms.map(qn).join(' &middot; ') : '<span class="mut">none this match</span>'}</div>` : `<div class="small mut">You did not play. Role: ${esc(c.roleTxt)}.</div>`}
  <div class="arow" style="grid-template-columns:1fr auto;margin-top:6px"><span>Coach trust</span><b>${c.tr.t0} &rarr; ${c.tr.t1} <small class="mut">(pull to ${c.tr.target}${c.tr.perf ? ', rating ' + (c.tr.perf > 0 ? '+' : '') + c.tr.perf : ''}${c.tr.train ? ', training +' + c.tr.train : ''})</small></b></div>
  ${c.lines.map(l => `<div class="arow" style="grid-template-columns:1fr auto"><span>${esc(l[0])}</span><b>+${fmt(l[1])}</b></div>`).join('')}</div>`;
}
function goNextSeason() { startNextSeason(); closeModal(true); tab = 'club'; leagueTab = 'table'; renderTop(); render(); toast('Season ' + S.season + ' begins: ' + TIERS[S.tier]); }
const CTUT = [
  ['Your career starts here', 'You are a young, unproven player at a small club. Grow your overall, win a starting place, score the goals, win awards, and earn bigger contracts. Everything is saved on this device.'],
  ['Win the coach\'s trust', 'The coach picks the team. <b>Trust 50+</b> and you start. <b>25+</b> and you come on at half-time. Below that you sit out. Good ratings and a rising overall raise trust.'],
  ['Train before every match', 'Skill drills (an 18 second touch mini game) improve your main attribute. Recovery restores fitness. Film study widens your key-moment zone. A free session each matchday, more via ads.'],
  ['Key moments', 'Three times a match something happens to you: a shot, a through-ball, a tackle, a save. Stop the marker inside the green zone to succeed. Skip the match and the game plays them for you, with lower odds.'],
  ['Seasons, awards and offers', 'Hit your season goals for coins and fame. Win awards like Golden Boot. At season end, clubs make you offers: stay, or move up a league for more pay and tougher matches.']
];

/* ---------- boot ---------- */
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeModal(); });
showTitle();
})();

</script>
</body>
</html>
